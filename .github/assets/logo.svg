<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sy-title">
    <title id="sy-title">synergos logo: a figure eight whose loops, the dispatching side and the worker, cross at the message bus while a message runs the round trip</title>

    <!-- dispatching side: the command leaves the bus and comes back as a reply -->
    <path d="M128 128 C96 76 36 76 36 128 C36 180 96 180 128 128" stroke="#8B5CF6" stroke-width="20" stroke-linecap="round"/>

    <!-- worker side -->
    <path d="M128 128 C160 76 220 76 220 128 C220 180 160 180 128 128" stroke="#14B8A6" stroke-width="20" stroke-linecap="round"/>

    <!-- the bus, where both sides cross -->
    <circle cx="128" cy="128" r="17" fill="#6366F1"/>
    <circle cx="128" cy="128" r="6" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- a message: command over to the worker, reply back to the dispatcher -->
    <circle r="7" fill="#FFFFFF" stroke="#6366F1" stroke-opacity="0.35" stroke-width="3">
        <animateMotion dur="4s" repeatCount="indefinite" path="M128 128 C160 76 220 76 220 128 C220 180 160 180 128 128 C96 76 36 76 36 128 C36 180 96 180 128 128"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
    </circle>
</svg>
