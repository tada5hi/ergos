<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sa-title">
    <title id="sa-title">@hubwire/amqp logo: three components connected through a RabbitMQ exchange</title>

    <defs>
        <linearGradient id="sa-tile" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.24"/>
            <stop offset="1" stop-color="#14B8A6" stop-opacity="0.24"/>
        </linearGradient>
        <linearGradient id="sa-edge" x1="24" y1="24" x2="232" y2="232" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#14B8A6"/>
        </linearGradient>

        <!-- one spoke per component, fading from the component's colour into the exchange -->
        <linearGradient id="sa-spoke-a" x1="128" y1="62" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#F97316"/>
        </linearGradient>
        <linearGradient id="sa-spoke-b" x1="185" y1="161" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop stop-color="#14B8A6"/>
            <stop offset="1" stop-color="#F97316"/>
        </linearGradient>
        <linearGradient id="sa-spoke-c" x1="71" y1="161" x2="128" y2="128" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0EA5E9"/>
            <stop offset="1" stop-color="#F97316"/>
        </linearGradient>

        <linearGradient id="sa-bus" x1="128" y1="106" x2="128" y2="150" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FB923C"/>
            <stop offset="1" stop-color="#EA580C"/>
        </linearGradient>
    </defs>

    <!-- rounded app-icon tile -->
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sa-tile)"/>
    <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="55.25" stroke="url(#sa-edge)" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- spokes: every component talks to the exchange, never to another component directly -->
    <path d="M128 62 V128" stroke="url(#sa-spoke-a)" stroke-width="16" stroke-linecap="round"/>
    <path d="M185 161 L128 128" stroke="url(#sa-spoke-b)" stroke-width="16" stroke-linecap="round"/>
    <path d="M71 161 L128 128" stroke="url(#sa-spoke-c)" stroke-width="16" stroke-linecap="round"/>

    <!-- the bus is a RabbitMQ exchange: amqp-extension's routing diamond -->
    <path d="M128 91 L165 128 L128 165 L91 128 Z" fill="url(#sa-bus)" fill-opacity="0.2"/>
    <path d="M128 103.5 L152.5 128 L128 152.5 L103.5 128 Z" fill="url(#sa-bus)"/>
    <circle cx="128" cy="128" r="6" fill="#FFFFFF" fill-opacity="0.85"/>

    <!-- components: a tile with a status light -->
    <g>
        <rect x="99" y="33" width="58" height="58" rx="17" fill="#8B5CF6"/>
        <circle cx="140" cy="50" r="5" fill="#FFFFFF">
            <animate attributeName="fill-opacity" values="1;0.35;1" dur="3.6s" repeatCount="indefinite"/>
        </circle>
    </g>
    <g>
        <rect x="156" y="132" width="58" height="58" rx="17" fill="#14B8A6"/>
        <circle cx="197" cy="149" r="5" fill="#FFFFFF">
            <animate attributeName="fill-opacity" values="1;0.35;1" dur="3.6s" begin="-1.2s" repeatCount="indefinite"/>
        </circle>
    </g>
    <g>
        <rect x="42" y="132" width="58" height="58" rx="17" fill="#0EA5E9"/>
        <circle cx="83" cy="149" r="5" fill="#FFFFFF">
            <animate attributeName="fill-opacity" values="1;0.35;1" dur="3.6s" begin="-2.4s" repeatCount="indefinite"/>
        </circle>
    </g>
</svg>
