<svg width="960" height="400" viewBox="0 0 960 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ar-title ar-desc">
    <title id="ar-title">How a command travels through synergos</title>
    <desc id="ar-desc">A RemoteDispatcher publishes a build command to the work routing builder. The MessageBus hands it to a driver (memory or AMQP), a RemoteWorker consumes it into a Component, and the component's buildFinished reply is published to builder-events, where the dispatching side consumes it. A LocalDispatcher calls the same component in-process.</desc>

    <style>
        :root {
            --fg: #1F2328;
            --muted: #59636E;
            --panel: #F6F8FA;
            --panel-edge: #D1D9E0;
            --card: #FFFFFF;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #F0F6FC;
                --muted: #9198A1;
                --panel: #151B23;
                --panel-edge: #3D444D;
                --card: #0D1117;
            }
        }
        text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--fg); }
        .muted { fill: var(--muted); }
        .code { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
        .label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--muted); }
        .title { font-size: 15px; font-weight: 600; }
        .panel { fill: var(--panel); stroke: var(--panel-edge); }
        .card { fill: var(--card); }
    </style>

    <defs>
        <marker id="ar-head-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#8B5CF6"/>
        </marker>
        <marker id="ar-head-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 Z" fill="#14B8A6"/>
        </marker>
        <linearGradient id="ar-bus" x1="316" y1="16" x2="644" y2="316" gradientUnits="userSpaceOnUse">
            <stop stop-color="#8B5CF6" stop-opacity="0.14"/>
            <stop offset="1" stop-color="#14B8A6" stop-opacity="0.14"/>
        </linearGradient>
    </defs>

    <!-- dispatching process -->
    <rect class="panel" x="16" y="16" width="250" height="300" rx="18"/>
    <text class="label" x="36" y="44">dispatcher process</text>

    <rect class="card" x="36" y="64" width="210" height="72" rx="12" stroke="#8B5CF6" stroke-width="1.5"/>
    <text class="title" x="54" y="92">RemoteDispatcher</text>
    <text class="code muted" x="54" y="116" font-size="12">dispatch('build', { id })</text>

    <rect class="card" x="36" y="196" width="210" height="72" rx="12" stroke="#14B8A6" stroke-width="1.5"/>
    <text class="title" x="54" y="224">messageBus.consume</text>
    <text class="code muted" x="54" y="248" font-size="12">{ buildFinished: … }</text>

    <!-- the bus -->
    <rect x="316" y="16" width="328" height="300" rx="18" fill="url(#ar-bus)" stroke="#6366F1" stroke-opacity="0.45"/>
    <text class="label" x="340" y="44">message bus</text>
    <text class="muted" x="620" y="44" font-size="12" text-anchor="end">dispatch by type · hooks</text>

    <rect class="card" x="340" y="82" width="280" height="36" rx="18" stroke="#8B5CF6" stroke-opacity="0.6"/>
    <text class="code" x="358" y="105" font-size="12">work · builder</text>
    <g fill="#8B5CF6">
        <rect x="550" y="91" width="12" height="18" rx="3" fill-opacity="0.35"/>
        <rect x="568" y="91" width="12" height="18" rx="3" fill-opacity="0.6"/>
        <rect x="586" y="91" width="12" height="18" rx="3"/>
    </g>

    <text class="muted" x="480" y="160" font-size="12" text-anchor="middle">work: one consumer per message</text>
    <text class="muted" x="480" y="178" font-size="12" text-anchor="middle">pubSub: every consumer</text>

    <rect class="card" x="340" y="214" width="280" height="36" rx="18" stroke="#14B8A6" stroke-opacity="0.6"/>
    <text class="code" x="358" y="237" font-size="12">work · builder-events</text>
    <g fill="#14B8A6">
        <rect x="550" y="223" width="12" height="18" rx="3"/>
        <rect x="568" y="223" width="12" height="18" rx="3" fill-opacity="0.6"/>
        <rect x="586" y="223" width="12" height="18" rx="3" fill-opacity="0.35"/>
    </g>

    <text class="label" x="340" y="291">driver</text>
    <rect x="392" y="274" width="80" height="26" rx="13" fill="#6366F1" fill-opacity="0.16" stroke="#6366F1" stroke-opacity="0.5"/>
    <text class="code" x="432" y="291" font-size="11" text-anchor="middle">memory</text>
    <rect x="482" y="274" width="138" height="26" rx="13" fill="#F97316" fill-opacity="0.16" stroke="#F97316" stroke-opacity="0.55"/>
    <text class="code" x="551" y="291" font-size="11" text-anchor="middle">@synergos/amqp</text>

    <!-- worker process -->
    <rect class="panel" x="694" y="16" width="250" height="300" rx="18"/>
    <text class="label" x="714" y="44">worker process</text>

    <rect x="714" y="58" width="210" height="236" rx="14" stroke="#14B8A6" stroke-opacity="0.6" stroke-dasharray="5 5" fill="#14B8A6" fill-opacity="0.06"/>
    <text class="title" x="730" y="84">RemoteWorker</text>

    <rect class="card" x="730" y="100" width="178" height="178" rx="12" stroke="#14B8A6" stroke-width="1.5"/>
    <text class="title" x="746" y="126">Component</text>
    <text class="code muted" x="746" y="152" font-size="12">mount('build', …)</text>
    <text class="code muted" x="746" y="190" font-size="12">context.handle(</text>
    <text class="code muted" x="760" y="208" font-size="12">'buildFinished',</text>
    <text class="code muted" x="746" y="226" font-size="12">)</text>
    <rect x="746" y="246" width="146" height="20" rx="10" fill="#14B8A6" fill-opacity="0.14"/>
    <text class="code" x="819" y="260" font-size="10.5" text-anchor="middle">start · stop · status</text>

    <!-- the command, left to right -->
    <path d="M246 100 H336" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ar-head-violet)"/>
    <path d="M620 100 H710" stroke="#8B5CF6" stroke-width="2" marker-end="url(#ar-head-violet)"/>
    <text class="code" x="291" y="90" font-size="11" text-anchor="middle" fill="#8B5CF6" style="fill:#8B5CF6">build</text>
    <text class="code" x="665" y="90" font-size="11" text-anchor="middle" style="fill:#8B5CF6">consume</text>

    <!-- the reply, right to left -->
    <path d="M714 232 H624" stroke="#14B8A6" stroke-width="2" marker-end="url(#ar-head-teal)"/>
    <path d="M340 232 H250" stroke="#14B8A6" stroke-width="2" marker-end="url(#ar-head-teal)"/>
    <text class="code" x="669" y="222" font-size="11" text-anchor="middle" style="fill:#14B8A6">reply</text>
    <text class="code" x="295" y="222" font-size="11" text-anchor="middle" style="fill:#14B8A6">buildFinished</text>

    <g>
        <circle r="9" fill="#8B5CF6" fill-opacity="0.25"/>
        <circle r="4.5" fill="#8B5CF6"/>
        <animateMotion dur="3.2s" repeatCount="indefinite" path="M246 100 H714"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.44;0.5;1" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
        <circle r="9" fill="#14B8A6" fill-opacity="0.25"/>
        <circle r="4.5" fill="#14B8A6"/>
        <animateMotion dur="3.2s" begin="1.6s" repeatCount="indefinite" path="M714 232 H246"/>
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.44;0.5;1" dur="3.2s" begin="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- in-process alternative -->
    <rect class="panel" x="16" y="336" width="928" height="48" rx="14" stroke-dasharray="5 5"/>
    <text class="title" x="36" y="365">LocalDispatcher</text>
    <text class="muted" x="166" y="365" font-size="13">calls the same Component in-process: no bus, no broker. <tspan class="code" font-size="12">dispatch()</tspan> returns the replies.</text>
</svg>
